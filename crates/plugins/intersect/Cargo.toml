[package]
name = "vectorcraft-plugin-intersect"
description = "VectorCraft WebAssembly object filter plug-in: Intersection Anchors"
version = "1.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Not a member of the VectorCraft workspace: it builds for wasm32-unknown-unknown only.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
